<!DOCTYPE html>
<html lang="it">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Contatti di Chiara Tondi, fashion designer."
    >

    <title>Contact — Chiara Tondi</title>

    <script>
        (function () {
            var t = localStorage.getItem("theme");
            if (
                t === "dark" ||
                (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
            ) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <header class="site-header">

        <div class="container nav-wrapper">

            <a class="logo" href="index.html">
                <img src="images_webp/logo.jpg" alt="Chiara Tondi">
                CHIARA TONDI
            </a>

            <nav aria-label="Navigazione principale">

                <a href="index.html">
                    Home
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="portfolio.html">
                    Portfolio
                </a>

                <a class="active" href="contact.html">
                    Contact
                </a>

                <button id="theme-toggle" type="button" aria-label="Cambia tema">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <g class="icon-moon">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                        </g>
                        <g class="icon-sun">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                        </g>
                    </svg>
                </button>

            </nav>

        </div>

    </header>


    <main>

        <section class="contact-section">

            <div class="container contact-grid">

                <div>

                    <p class="eyebrow" data-reveal>
                        Contact
                    </p>

                    <h1>
                        Let's make<br>
                        something<br>
                        <em>together.</em>
                    </h1>

                </div>


                <div class="contact-details" data-reveal-stagger>

                    <div class="contact-block">

                        <p class="eyebrow">
                            Email
                        </p>

                        <a
                            class="big-link"
                            href="mailto:tondi.chiara@outlook.it"
                            data-magnetic="0.12"
                        >
                            tondi.chiara@outlook.it
                        </a>

                    </div>


                    <div class="contact-block">

                        <p class="eyebrow">
                            Social
                        </p>

                        <a
                            class="big-link"
                            href="https://www.linkedin.com/in/chiara-tondi-323119333/"
                            target="_blank"
                            rel="noopener noreferrer"
                            data-magnetic="0.12"
                        >
                            LinkedIn ↗
                        </a>

                        <a
                            class="big-link"
                            href="https://www.instagram.com/tndchr/"
                            target="_blank"
                            rel="noopener noreferrer"
                            data-magnetic="0.12"
                        >
                            Instagram ↗
                        </a>

                    </div>


                    <div class="contact-block">

                        <p class="eyebrow">
                            Location
                        </p>

                        <p class="contact-location">
                            Rome, Italy
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container footer-grid">

            <div>

                <p class="footer-name">
                    CHIARA TONDI
                </p>

                <p>
                    Fashion Design Portfolio
                </p>

            </div>

            <div class="footer-links">

                <a href="mailto:tondi.chiara@outlook.it">
                    tondi.chiara@outlook.it
                </a>

                <a
                    href="https://www.linkedin.com/in/chiara-tondi-323119333/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    LinkedIn
                </a>

                <a
                    href="https://www.instagram.com/tndchr/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Instagram
                </a>

            </div>

            <p class="copyright">
                © 2026 Chiara Tondi
            </p>

        </div>

    </footer>

<script src="js/navbar.js"></script>
<script src="js/animations.js"></script>
<script src="js/darkmode.js"></script>

</body>
</html>
